:root {
  --verde-escuro: #0e2726;
  --nogueira: #6f5343;
  --avela: #af8a6f;
  --off-white: #f5eee1;
  --dourado: #a07843;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--off-white);
  color: var(--verde-escuro);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1.2rem 3rem;
}

.container {
  max-width: 480px;
  width: 100%;
  text-align: center;
}

/* ============ CAPA QUADRADA COM TEXTO SOBREPOSTO ============ */
.capa {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background-image: url('capa-ebook.png');
  background-size: cover;
  background-position: center;
  background-color: #ece5da;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 2.5rem;
  box-shadow: 0 20px 60px -20px rgba(14, 39, 38, 0.35);
}

/* Overlay gradiente sutil na base pra o texto ficar legível */
.capa::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(245, 238, 225, 0) 40%,
    rgba(245, 238, 225, 0.4) 65%,
    rgba(245, 238, 225, 0.88) 100%
  );
  pointer-events: none;
}

.capa-conteudo {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding: 2rem 1.5rem;
  text-align: center;
  z-index: 2;
}

.capa-eyebrow {
  font-size: 0.62rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--dourado);
  margin-bottom: 0.7rem;
  font-weight: 600;
}

.capa-titulo {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 400;
  font-size: clamp(2.6rem, 12vw, 3.8rem);
  line-height: 0.95;
  letter-spacing: -0.02em;
  color: var(--verde-escuro);
  margin-bottom: 0.4rem;
}

.capa-subtitulo {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic;
  font-weight: 400;
  font-size: clamp(0.95rem, 3.5vw, 1.15rem);
  color: var(--nogueira);
}

/* ============ INFO E CTA ============ */
.divisor {
  width: 40px;
  height: 1px;
  background: var(--dourado);
  opacity: 0.5;
  margin: 0 auto 1.6rem;
}

.resumo {
  font-size: 1rem;
  line-height: 1.65;
  color: var(--verde-escuro);
  opacity: 0.85;
  margin-bottom: 2rem;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
}

.cta {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  background: var(--verde-escuro);
  color: var(--off-white);
  text-decoration: none;
  padding: 1.1rem 2.4rem;
  border-radius: 4px;
  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 6px 20px rgba(14, 39, 38, 0.18);
}
.cta:hover {
  background: var(--nogueira);

  font-size: 0.95rem;
  transition: transform 0.3s ease;
}

  transform: translateY(2px);
}

.assinatura {
  margin-top: 2.5rem;
  font-size: 0.66rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--nogueira);
  opacity: 0.7;
}

  body { padding: 1.5rem 1rem 2.5rem; }
